name: environments
on: 
  workflow_call:
    inputs:
      environment:
        required: true
        type: string

jobs:
  environment:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment == 'production' && 'production' || '' }}
    steps:
      - name: zxcvbn
        run: echo "Hello from ${{ inputs.environment }}"

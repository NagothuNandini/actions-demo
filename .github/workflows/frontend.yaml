name: "Frontend workflow"
on: 
  push:
    paths: frontend/**
    branches: main

jobs:
  greet_from_frontend:
    runs-on: ubuntu-latest
    outputs:
      file: ${{ steps.run_code.outputs.text }}
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: run code
        id: run_code
        run: echo "Hello world from Frontend......." >> frontend.txt

      - name: upload frontend file
        uses: actions/upload-artifact@v4
        with:
          name: sharedfile
          path: frontend.txt
        

      - name: show file contents
        run: cat frontend/hello.txt

  job_2:
    runs-on: ubuntu-latest
    needs: greet_from_frontend
    steps:
      - name: download artifact
        uses: actions/download-artifact@v4
        with:
          name: sharedfile
      - name: show file contents
        run: cat frontend.txt
        
        
        
      

name: "Frontend workflow"
on: 
  push:
    paths: frontend/**

jobs:
  greet_from_frontend:
    runs-on: ubuntu-latest
    outputs:
      file: $ {{ steps.run_code.outputs.text }}
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: run code
        id: run_code
        run: echo "text = Hello world from Frontend" >> $GITHUB_OUTPUT

      - name: show file contents
        run: cat frontend/hello.txt

  job_2:
    runs-on: ubuntu-latest
    needs: greet_from_frontend
    steps:
      - name: xcvbn
        run: echo "${{ needs.greet_from_frontend.outputs.file }}"
        
      
